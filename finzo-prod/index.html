<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#07080F" />
  <meta name="description" content="Finzo — Your complete financial OS. Analyze statements, track investments, AI insights." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/finzo/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%237C6FFF'/><text y='23' x='7' font-size='20' font-weight='900' fill='white' font-family='Georgia'>F</text></svg>" />
  <title>Finzo — Financial OS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #07080F; color: #EDF0FF; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden; }
    #root { height: 100dvh; }
    #splash { position: fixed; inset: 0; background: #07080F; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s; }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #7C6FFF, #FF6B9D); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: #fff; font-family: Georgia, serif; box-shadow: 0 8px 40px rgba(124,111,255,0.5); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap');
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-logo">F</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('splash')?.classList.add('hide'), 600);
    });
  </script>
</body>
</html>
